<svg width="495" height="230" viewBox="0 0 495 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDAE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDAE" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70A5FD"/>
      <stop offset="50%" stop-color="#38BDAE"/>
      <stop offset="100%" stop-color="#BF91F3"/>
    </linearGradient>
  </defs>
  <style>
    .header { font: 700 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70A5FD; }
    .axis-text { font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7982A9; }
    .badge { font: 700 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #10B981; }
  </style>
  <rect width="495" height="230" rx="6" fill="#1A1B27" stroke="#2F334D" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(25, 28)">
    <circle cx="8" cy="-5" r="5" fill="#38BDAE"/>
    <text x="20" y="0" class="header">Engineering Velocity &amp; Commit Telemetry</text>
    <rect x="360" y="-12" width="105" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
    <text x="370" y="2" class="badge">🔥 420+ Commits</text>
  </g>

  <!-- Grid Lines -->
  <line x1="45" y1="65" x2="465" y2="65" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3 3"/>
  <line x1="45" y1="105" x2="465" y2="105" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3 3"/>
  <line x1="45" y1="145" x2="465" y2="145" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3 3"/>
  <line x1="45" y1="185" x2="465" y2="185" stroke="#2F334D" stroke-width="1"/>

  <!-- Area Fill under curve -->
  <polygon points="50,185 85,160 125,170 165,145 205,150 245,120 285,130 325,95 365,75 405,60 445,45 445,185" fill="url(#areaGrad)"/>

  <!-- Smooth Trend Line -->
  <polyline points="50,185 85,160 125,170 165,145 205,150 245,120 285,130 325,95 365,75 405,60 445,45" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data Points -->
  <circle cx="50" cy="185" r="4" fill="#70A5FD"/>
  <circle cx="125" cy="170" r="4" fill="#70A5FD"/>
  <circle cx="205" cy="150" r="4" fill="#38BDAE"/>
  <circle cx="285" cy="130" r="4" fill="#38BDAE"/>
  <circle cx="365" cy="75" r="4" fill="#BF91F3"/>
  <circle cx="445" cy="45" r="5" fill="#E50914" stroke="#FFF" stroke-width="1.5"/>

  <!-- X-Axis Labels -->
  <text x="40" y="205" class="axis-text">Week 1</text>
  <text x="115" y="205" class="axis-text">Week 3</text>
  <text x="195" y="205" class="axis-text">Week 5</text>
  <text x="275" y="205" class="axis-text">Week 7</text>
  <text x="355" y="205" class="axis-text">Week 9</text>
  <text x="420" y="205" class="axis-text">Current ⚡</text>
</svg>